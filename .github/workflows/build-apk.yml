name: Build Cosmic Space Flight APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          unzip -o "$ZIP" -d project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find project -name settings.gradle.kts -o -name settings.gradle | head -1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: |
          cd "$PROJECT_DIR"
          gradle wrapper

      - name: Fix debug signing
        run: |
          sed -i '/signingConfig = signingConfigs.getByName("debugConfig")/d' "$PROJECT_DIR/app/build.gradle.kts"

      - name: Fix CrewScreen
        run: |
          CREW_SCREEN=$(find "$PROJECT_DIR/app/src/main/java" -name "CrewScreen.kt" | head -1)

          if [ -z "$CREW_SCREEN" ]; then
            echo "ERROR: CrewScreen.kt not found!"
            exit 1
          fi

          echo "Patching: $CREW_SCREEN"

          python3 - "$CREW_SCREEN" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text()

          # Fix model property names
          text = text.replace(
              "astronaut.experienceLevel",
              "astronaut.level"
          )

          text = text.replace(
              "astronaut.missionsCompleted",
              "astronaut.missionsFlown"
          )

          text = text.replace(
              "astronaut.role.specialPerk",
              "astronaut.role.perkDescription"
          )

          # Remove unsupported enum branches.
          text = text.replace(
              '    CrewRole.COMMANDER -> Color(0xFFFFD700).copy(alpha = 0.2f)\n',
              ''
          )
          text = text.replace(
              '    CrewRole.SPECIALIST -> Color(0xFF00E676).copy(alpha = 0.2f)\n',
              ''
          )

          text = text.replace(
              '    CrewRole.COMMANDER -> Icons.Default.Stars\n',
              ''
          )
          text = text.replace(
              '    CrewRole.SPECIALIST -> Icons.Default.Shield\n',
              ''
          )

          text = text.replace(
              '    CrewRole.COMMANDER -> Color(0xFFFFD700)\n',
              ''
          )
          text = text.replace(
              '    CrewRole.SPECIALIST -> Color(0xFF00E676)\n',
              ''
          )

          path.write_text(text)
          print("CrewScreen.kt patched successfully.")
          PY

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-space-flight-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
