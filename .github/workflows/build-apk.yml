name: Build Cosmic Space Flight APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          unzip -o "$ZIP" -d project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find project -name settings.gradle.kts -o -name settings.gradle | head -1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: |
          cd "$PROJECT_DIR"
          gradle wrapper

      - name: Fix debug signing
        run: |
          sed -i '/signingConfig = signingConfigs.getByName("debugConfig")/d' "$PROJECT_DIR/app/build.gradle.kts"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-space-flight-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
